name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      # The last version listed becomes JAVA_HOME (the launcher). JDK 25 runs the Gradle daemon.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            25
            17

      # Android platform for compileSdk 37 and the build-tools the local setup uses, from the runner's SDK.
      - name: Install Android SDK packages
        run: |
          test -d "$ANDROID_HOME"
          sdkmanager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          "$sdkmanager" --licenses < <(yes) > /dev/null
          "$sdkmanager" --install "platforms;android-37.0" "build-tools;36.0.0" \
            || "$sdkmanager" --install "platforms;android-37" "build-tools;36.0.0"

      # Uses the pinned URL and sha256 in scripts/ktlint-setup.sh; fails on a hash mismatch.
      - name: Install pinned ktlint
        run: bash -c 'source scripts/ktlint-setup.sh && ktlint_prepare'

      # Every branch writes the Gradle cache, so pushes to main also save it.
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      # Lets Gradle find the setup-java JDK 25 for the daemon without a download.
      - name: Point Gradle at JDK 25
        run: |
          mkdir -p "$HOME/.gradle"
          echo "org.gradle.java.installations.fromEnv=JAVA_HOME_25_X64" >> "$HOME/.gradle/gradle.properties"

      # check.sh writes its step logs to TMPDIR; the failure step uploads them.
      - name: Run scripts/check.sh
        run: |
          export TMPDIR="$RUNNER_TEMP/synthx-check-logs"
          mkdir -p "$TMPDIR"
          ./scripts/check.sh

      - name: Upload check logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: check-logs
          path: ${{ runner.temp }}/synthx-check-logs
          retention-days: 7
          if-no-files-found: ignore
