org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true

# AGP 9's built-in-Kotlin and new DSL are opted out here: built-in Kotlin has
# documented, unresolved compatibility issues with KSP/Room, so the existing
# kotlin-android plugin application and KSP setup are kept working unchanged.
# android.newDsl must also be false because kotlin-android isn't compatible
# with the new DSL. This opt-out is expected to be removed in AGP 10.0.
android.builtInKotlin=false
android.newDsl=false
